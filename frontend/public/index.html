<!DOCTYPE html>
<html lang="en">

<head>
  <title>LearnJCU Interactive</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/static/css/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="index-container">

    <div class="index-logo">
      <img src="/static/images/white_logo_icon.png" alt="JCU Icon" class="jcu-main-logo">
      <h1 class="learnjcu-heading">LearnJCU<br>Interactive</h1>
    </div>

    <div class="session-selection">
      <button onclick="window.location.href='/static/start.html'" class="session-button start-session">Start Session</button>
      <button onclick="window.location.href='/static/join.html'" class="session-button join-session">Join Session</button>
    </div>
    
    <footer>
      <img src="/static/images/jcu_full_logo.png" alt="JCU Logo" class="jcu-footer-logo">
    </footer>

    <!-- Load the same JS stack as index -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>

  </div>

</html>
